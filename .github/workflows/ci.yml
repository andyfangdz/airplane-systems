name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # on a pull request, its merge commit and both parents, so HEAD^1 is the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting (fix with npm run format)
        run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:compiler
      # A pull request runs the test files its changes reach (vitest --changed, see vitest.config.mts); main runs them all.
      - name: Unit tests
        run: npm test -- ${{ github.event_name == 'pull_request' && '--changed HEAD^1 --passWithNoTests' || '' }}
      - run: npm run test:react
      - run: npm run test:trusted-preview
      - run: npm run build
      - name: Install browsers for interaction tests
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui:geometry
      - run: npm run test:ui:doors
        env:
          DOOR_SHOTS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-door-review
          path: .shots/mechanisms
          if-no-files-found: ignore
      - run: npm run test:ui:m20c
      - run: npm run test:ui:fleet
      - run: npm run test:ui:depth
      - run: npm run test:ui:tour
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: test-results/
          if-no-files-found: ignore
