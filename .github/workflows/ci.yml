name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting (fix with npm run format)
        run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:trusted-preview
      - run: npm run build
      - name: Install browsers for interaction tests
        run: npx playwright-core install --with-deps chromium webkit
      - run: npm run test:ui:m20c
      - run: npm run test:ui:fleet
      - run: npm run test:ui:depth
